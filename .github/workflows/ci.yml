name: CI

on:
  push:
  pull_request:

# Actions are pinned to commit SHAs (engineering standards §5.4).
# actions/checkout v5.1.0 = fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
# actions/cache    v5.1.0 = caa296126883cff596d87d8935842f9db880ef25

jobs:
  fitness:
    name: Fitness functions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Tool unit tests, dependency rule, content validation
        run: tools/test.sh fitness

  engine:
    name: Script analysis, headless tests, replay determinism
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Read engine pin
        id: pin
        run: grep GODOT_VERSION tools/godot.pin >> "$GITHUB_OUTPUT"
      - name: Cache pinned engine
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .cache/godot
          key: godot-${{ steps.pin.outputs.GODOT_VERSION }}-linux-x86_64
      - name: Download and verify engine
        run: tools/godot.sh
      - name: Static analysis (typed GDScript)
        run: tools/test.sh scripts
      - name: Headless test suite
        run: tools/test.sh unit
      - name: Replay fixtures twice, diff hashes
        run: tools/test.sh replay
